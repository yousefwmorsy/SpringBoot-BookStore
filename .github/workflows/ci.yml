name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 26 with Temurin
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Compile, test, generate reports, and check coverage (≥ 80%)
        id: verify
        continue-on-error: true
        run: ./mvnw verify --no-transfer-progress

      - name: Fail workflow if compilation, tests, or coverage failed
        if: steps.verify.outcome == 'failure'
        run: |
          echo "❌ Build failed. See the coverage summary above for details."
          exit 1